    <!-- Position fields -->
    <text x="55" y="250" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Position</text>
    <rect x="55" y="255" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="60" y="269" font-size="10" fill="#000" font-family="monospace">x: -7</text>
    
    <rect x="135" y="255" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="140" y="269" font-size="10" fill="#000" font-family="monospace">y: -7</text>
    
    <rect x="215" y="255" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="220" y="269" font-size="10" fill="#000" font-family="monospace">z: -7</text>
    
    <!-- Velocity fields -->
    <text x="55" y="285" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Velocity</text>
    <rect x="55" y="290" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="60" y="304" font-size="10" fill="#000" font-family="monospace">x: 1</text>
    
    <rect x="135" y="290" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="140" y="304" font-size="10" fill="#000" font-family="monospace">y: 0</text>
    
    <rect x="215" y="290" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="220" y="304" font-size="10" fill="#000" font-family="monospace">z: 0</text>
    
    <!-- Mass field -->
    <text x="305" y="250" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Mass</text>
    <rect x="305" y="255" width="70" height="50" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="310" y="288" font-size="12" fill="#000" font-family="monospace">5</text>
  </g>
  
  <!-- Object 4 Card -->
  <g>
    <rect x="420" y="200" width="350" height="80" rx="6" fill="#2a3a4a" opacity="0.85" stroke="#4a6a8a" stroke-width="1"/>
    <text x="440" y="225" font-size="16" font-weight="bold" fill="#aaa" font-family="Arial, sans-serif">Object 4</text>
    
    <!-- Position fields -->
    <text x="445" y="250" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Position</text>
    <rect x="445" y="255" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="450" y="269" font-size="10" fill="#000" font-family="monospace">x: 8</text>
    
    <rect x="525" y="255" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="530" y="269" font-size="10" fill="#000" font-family="monospace">y: -5</text>
    
    <rect x="605" y="255" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="610" y="269" font-size="10" fill="#000" font-family="monospace">z: 4</text>
    
    <!-- Velocity fields -->
    <text x="445" y="285" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Velocity</text>
    <rect x="445" y="290" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="450" y="304" font-size="10" fill="#000" font-family="monospace">x: 0</text>
    
    <rect x="525" y="290" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="530" y="304" font-size="10" fill="#000" font-family="monospace">y: 1</text>
    
    <rect x="605" y="290" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="610" y="304" font-size="10" fill="#000" font-family="monospace">z: 0</text>
    
    <!-- Mass field -->
    <text x="695" y="250" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Mass</text>
    <rect x="695" y="255" width="70" height="50" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="700" y="288" font-size="12" fill="#000" font-family="monospace">10</text>
  </g>
  
  <!-- Control buttons (right side) -->
  <g>
    <!-- Plus button -->
    <circle cx="750" cy="150" r="20" fill="none" stroke="#7a9aba" stroke-width="2"/>
    <line x1="750" y1="140" x2="750" y2="160" stroke="#7a9aba" stroke-width="2"/>
    <line x1="740" y1="150" x2="760" y2="150" stroke="#7a9aba" stroke-width="2"/>
  </g>
  
  <!-- Start button (bottom right) -->
  <g>
    <text x="720" y="440" font-size="14" fill="#aaa" font-family="Arial, sans-serif" font-weight="bold">Start</text>
  </g>
</svg>