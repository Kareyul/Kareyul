<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <!-- Starfield background -->
  <defs>
    <radialGradient id="starBg" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#5a7fa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="480" fill="url(#starBg)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="30" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="120" cy="60" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="200" cy="40" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="320" cy="80" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="450" cy="25" r="1.3" fill="#fff" opacity="0.85"/>
  <circle cx="580" cy="70" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="700" cy="45" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="150" r="0.9" fill="#fff" opacity="0.65"/>
  <circle cx="350" cy="200" r="1.1" fill="#fff" opacity="0.75"/>
  <circle cx="650" cy="160" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="100" cy="350" r="1.3" fill="#fff" opacity="0.85"/>
  <circle cx="500" cy="380" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="750" cy="320" r="1.2" fill="#fff" opacity="0.8"/>
  
  <!-- Title: "Simulation Bodies" -->
  <text x="400" y="50" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">
    Simulation Bodies
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="75" font-size="14" fill="#aaa" text-anchor="middle" font-family="Arial, sans-serif">
    position in million km,  velocity in km/s,  mass in 10^26 kg
  </text>
  
  <!-- Object 1 Card -->
  <g>
    <rect x="30" y="100" width="350" height="80" rx="6" fill="#2a3a4a" opacity="0.85" stroke="#4a6a8a" stroke-width="1"/>
    <text x="50" y="125" font-size="16" font-weight="bold" fill="#aaa" font-family="Arial, sans-serif">Object 1</text>
    
    <!-- Position fields -->
    <text x="55" y="150" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Position</text>
    <rect x="55" y="155" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="60" y="169" font-size="10" fill="#000" font-family="monospace">x: 0</text>
    
    <rect x="135" y="155" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="140" y="169" font-size="10" fill="#000" font-family="monospace">y: 0</text>
    
    <rect x="215" y="155" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="220" y="169" font-size="10" fill="#000" font-family="monospace">z: 0</text>
    
    <!-- Velocity fields -->
    <text x="55" y="185" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Velocity</text>
    <rect x="55" y="190" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="60" y="204" font-size="10" fill="#000" font-family="monospace">x: 1</text>
    
    <rect x="135" y="190" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="140" y="204" font-size="10" fill="#000" font-family="monospace">y: 1</text>
    
    <rect x="215" y="190" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="220" y="204" font-size="10" fill="#000" font-family="monospace">z: 0</text>
    
    <!-- Mass field -->
    <text x="305" y="150" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Mass</text>
    <rect x="305" y="155" width="70" height="50" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="310" y="188" font-size="12" fill="#000" font-family="monospace">2000</text>
  </g>
  
  <!-- Object 2 Card -->
  <g>
    <rect x="420" y="100" width="350" height="80" rx="6" fill="#2a3a4a" opacity="0.85" stroke="#4a6a8a" stroke-width="1"/>
    <text x="440" y="125" font-size="16" font-weight="bold" fill="#aaa" font-family="Arial, sans-serif">Object 2</text>
    
    <!-- Position fields -->
    <text x="445" y="150" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Position</text>
    <rect x="445" y="155" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="450" y="169" font-size="10" fill="#000" font-family="monospace">x: 5</text>
    
    <rect x="525" y="155" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="530" y="169" font-size="10" fill="#000" font-family="monospace">y: 5</text>
    
    <rect x="605" y="155" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="610" y="169" font-size="10" fill="#000" font-family="monospace">z: 5</text>
    
    <!-- Velocity fields -->
    <text x="445" y="185" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Velocity</text>
    <rect x="445" y="190" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="450" y="204" font-size="10" fill="#000" font-family="monospace">x: 0</text>
    
    <rect x="525" y="190" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="530" y="204" font-size="10" fill="#000" font-family="monospace">y: 0</text>
    
    <rect x="605" y="190" width="70" height="20" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="610" y="204" font-size="10" fill="#000" font-family="monospace">z: 0</text>
    
    <!-- Mass field -->
    <text x="695" y="150" font-size="11" fill="#7a9aba" font-family="Arial, sans-serif">Mass</text>
    <rect x="695" y="155" width="70" height="50" rx="3" fill="#fff" stroke="#666" stroke-width="0.5"/>
    <text x="700" y="188" font-size="12" fill="#000" font-family="monospace">1000</text>
  </g>
  
  <!-- Object 3 Card -->
